name: Sync to Fork

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to ihyu-bit fork
        env:
          FORK_PAT: ${{ secrets.FORK_PAT }}
        run: |
          git remote add fork https://github.com/ihyu-bit/video_automation.git
          git -c http.extraHeader="Authorization: Bearer ${FORK_PAT}" push fork main --force
