name: Sync to Fork

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to ihyu-bit fork
        run: |
          git remote add fork https://x-access-token:${{ secrets.FORK_PAT }}@github.com/ihyu-bit/video_automation.git
          git push fork main --force
